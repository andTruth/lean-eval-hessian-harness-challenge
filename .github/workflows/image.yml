name: Image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/andtruth/lean-eval-hessian-harness-challenge

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build natively
        run: docker build -t "$IMAGE:$GITHUB_SHA-${{ matrix.arch }}" .
      - name: Check prepared tools and Mathlib cache offline
        run: |
          docker run --rm --init --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace" \
            "$IMAGE:$GITHUB_SHA-${{ matrix.arch }}" bash -euc '
            test "$(codex --version)" = "codex-cli 0.166.0"
            git --version
            lean --version
            cd problem
            printf "import Mathlib\n" > Ready.lean
            lake env lean Ready.lean
            lake build Problem
            git worktree add --detach scratch/check
            cd scratch/check/problem && lake build Problem
          '
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push qualified architecture
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push "$IMAGE:$GITHUB_SHA-${{ matrix.arch }}"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" --tag "$IMAGE:$GITHUB_SHA" \
            "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
          # After the first publication, make the GHCR package public for anonymous pulls.
